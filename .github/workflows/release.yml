  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode Android signing keystore
        run: |
          # 1. Decode raw secret to a temporary file
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/raw_keystore.jks

          # 2. Convert to standard JKS format using keytool to strip incompatible PKCS12 tags
          keytool -importkeystore \
            -srckeystore $RUNNER_TEMP/raw_keystore.jks \
            -srcstorepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -destkeystore $RUNNER_TEMP/keystore.jks \
            -deststorepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -deststoretype JKS

      - name: Build Android APK
        run: npm run tauri android build -- --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Sign Android APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$RUNNER_TEMP/oyot-release-signed.apk" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ runner.temp }}/oyot-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

