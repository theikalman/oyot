# Development broker.
#
# Anonymous, on every interface, because the point of running this is to pair
# two of your own devices: a laptop and a phone have to reach it, so localhost
# binding will not do, and making you create a password file before the app
# can connect at all is friction for no security gain.
#
# That is a real claim, not a shortcut. Signaling messages are signed end to
# end and a node_id is an Ed25519 public key, so the broker cannot forge,
# alter or replay one, and pairing still requires confirming the other
# device's id by hand. See docs/decisions/0009-authenticated-signaling.md.
# What the broker can still do is *read*: who is pairing with whom, and the
# SDP inside. On a trusted network that is acceptable for development.
#
# Do not expose this to the internet. For anything beyond a LAN you trust,
# start from mosquitto.prod.conf.example, which adds authentication, per
# device topic ACLs and TLS.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
