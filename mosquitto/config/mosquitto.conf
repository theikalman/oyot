# Reference broker for local development.
#
# Signaling messages are signed end to end (see
# docs/decisions/0009-authenticated-signaling.md), so a broker cannot forge or
# tamper with one. What it can still do is read them: who is pairing with whom,
# and the SDP inside. The settings below are the defence in depth for that, and
# they are the minimum for anything reachable beyond localhost.
#
# Create the password file before first run:
#   docker compose run --rm --entrypoint mosquitto_passwd mqtt -c -b \
#       /mosquitto/config/passwd <username> <password>
#
# For a broker on a real network, also terminate TLS and point the app at
# mqtts://host:8883 rather than mqtt://host:1883.

listener 1883

# No anonymous access. Every device authenticates.
allow_anonymous false
password_file /mosquitto/config/passwd

# Each client may only touch its own node-scoped topics. Without this, any
# authenticated client could subscribe to signaling/# and watch every pairing
# on the broker. %u is the username; give each device its own account.
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
