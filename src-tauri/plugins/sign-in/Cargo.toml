[package]
name = "tauri-plugin-sign-in"
version = "0.1.0"
description = "Signing in to backup providers through the phone's own facilities"
edition = "2021"
publish = false
# Tauri finds the plugin's Swift package and Gradle module through this.
links = "tauri-plugin-sign-in"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
