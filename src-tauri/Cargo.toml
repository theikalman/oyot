[package]
name = "oyot"
version = "0.0.18-alpha"
description = "Simple note taking app"
authors = ["AjiYakin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oyot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# For its Rust API only, which opens what a dialog returns on a phone: a
# content URI on Android, a security-scoped file URL on iOS. The dialog plugin
# already depends on it. No capability grants its commands, so the webview
# gains no filesystem access by it being registered.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
tauri-plugin-os = "2"
# Writing the export archive. `deflate` only: no encryption, no bzip2/zstd/lzma,
# and no `time`/`chrono` feature, so nothing is pulled in to stamp entries we
# do not stamp. Hand-rolling the container was the alternative and was rejected
# - a central directory an extractor half-accepts is a bug the user only finds
# after they have deleted the original.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Naming a backup file after a phone's content URI, whose last segment is
# percent-encoded. Already in the tree through `url`.
percent-encoding = "2"
# The backup provider trait is async and used as a trait object, one per
# remote destination (ADR 0025). Already in the tree.
async-trait = "0.1"
# Building sign-in and Drive addresses, and form bodies. Already in the tree.
url = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

# Local-network discovery (ADR 0018). Not on iOS: this binds a raw multicast
# socket, which there needs the `com.apple.developer.networking.multicast`
# entitlement and an approval request with a turnaround measured in weeks.
# iOS browses through Bonjour (NWBrowser) instead, which needs only an
# Info.plist entry, and plugs into the same `Discovery` surface.
[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = "0.21"

# Google Drive backups, which are desktop only for now (ADR 0025, decision 7).
# Kept to the desktop targets so the phone builds are untouched until the
# phone sign-in exists.
#
# reqwest is already in the tree through Tauri, without TLS. It gets rustls on
# the `ring` provider rather than its default `aws-lc-rs`: `ring` is what Tauri
# itself selects when it enables rustls, and one crypto library is enough.
# `rustls-no-provider` leaves installing that provider to us, which the Drive
# client does before it builds one. Default features off: no HTTP/2, no
# proxy discovery, nothing a handful of Drive API calls need.
#
# keyring keeps the refresh token in the OS keychain: Keychain on macOS,
# Credential Manager on Windows, Secret Service over zbus on Linux, which needs
# no system library.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"


# Defaults left the release binary unoptimised for size, which matters most on
# Android where the Rust library ships inside the APK. `opt-level = "s"` is the
# right trade for an app that is IO-bound rather than compute-bound.
#
# macOS arm64 binary: 16.0MB with cargo defaults, 7.8MB with this profile.
#
# Deliberately NOT `panic = "abort"`, which would take it to 6.2MB. Sync runs on
# detached tokio tasks (the MQTT poll loop, the event forwarders); with
# unwinding a panic there kills that task and the app keeps working, while abort
# takes the whole note-taking app down with it. 1.6MB is not worth that, and the
# panic surface is real: `db_snapshot::current_timestamp` unwraps
# `duration_since(UNIX_EPOCH)`, which a misconfigured device clock can trip.
#
# `strip` is "debuginfo" rather than true for Android's sake. Stripping symbols
# outright leaves no symbol table for AGP's `debugSymbolLevel = "SYMBOL_TABLE"`
# to extract, so the AAB ships without native debug symbols and Play Console
# reports them missing. "debuginfo" still drops DWARF, which is the bulk of the
# size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
