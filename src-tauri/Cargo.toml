[package]
name = "oyot"
version = "0.0.14-alpha"
description = "Simple note taking app"
authors = ["AjiYakin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oyot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rustls = "0.22"
rustls-native-certs = "0.7"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
tauri-plugin-os = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

# Local-network discovery (ADR 0018). Not on iOS: this binds a raw multicast
# socket, which there needs the `com.apple.developer.networking.multicast`
# entitlement and an approval request with a turnaround measured in weeks.
# iOS browses through Bonjour (NWBrowser) instead, which needs only an
# Info.plist entry, and plugs into the same `Discovery` surface.
[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = "0.21"


# Defaults left the release binary unoptimised for size, which matters most on
# Android where the Rust library ships inside the APK. `opt-level = "s"` is the
# right trade for an app that is IO-bound rather than compute-bound.
#
# macOS arm64 binary: 16.0MB with cargo defaults, 7.8MB with this profile.
#
# Deliberately NOT `panic = "abort"`, which would take it to 6.2MB. Sync runs on
# detached tokio tasks (the MQTT poll loop, the event forwarders); with
# unwinding a panic there kills that task and the app keeps working, while abort
# takes the whole note-taking app down with it. 1.6MB is not worth that, and the
# panic surface is real: `db_snapshot::current_timestamp` unwraps
# `duration_since(UNIX_EPOCH)`, which a misconfigured device clock can trip.
#
# `strip` is "debuginfo" rather than true for Android's sake. Stripping symbols
# outright leaves no symbol table for AGP's `debugSymbolLevel = "SYMBOL_TABLE"`
# to extract, so the AAB ships without native debug symbols and Play Console
# reports them missing. "debuginfo" still drops DWARF, which is the bulk of the
# size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
