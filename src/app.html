<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Oyot - Simple Note Taking App that Simply Works</title>
        <script>
            // Pick the theme before anything renders. The stored preference
            // lives in Rust, which cannot be read synchronously, so the last
            // applied value is mirrored here to avoid a flash of the wrong
            // theme on every launch while that round trip happens.
            try {
                var t = localStorage.getItem('oyot:theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = t;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        </script>
        <script>
            // Android's status and gesture bars, measured by MainActivity
            // (window.OyotInsets only exists there). Read here, before the
            // first paint, so the page does not start under the status bar
            // and jump down once the app has loaded. Read again on resize,
            // since rotating the device moves the bars and the cutout.
            // MainActivity also pushes changes itself, through the same
            // function.
            window.__oyotApplyInsets = function (insets) {
                try {
                    if (!insets && window.OyotInsets) {
                        insets = JSON.parse(window.OyotInsets.get());
                    }
                    if (!insets) return;
                    var style = document.documentElement.style;
                    ['top', 'right', 'bottom', 'left'].forEach(function (side) {
                        style.setProperty('--native-safe-' + side, (insets[side] || 0) + 'px');
                    });
                } catch (e) {
                    // Without the numbers the page falls back to env().
                }
            };
            window.__oyotApplyInsets();
            window.addEventListener('resize', function () {
                window.__oyotApplyInsets();
            });
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
