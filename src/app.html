<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Oyot - Simple Note Taking App that Simply Works</title>
        <script>
            // Pick the colour scheme before anything renders. The stored
            // choice lives in Rust, which cannot be read synchronously, so the
            // last applied one is mirrored here to avoid a flash of the wrong
            // colours on every launch while that round trip happens. The ids
            // and their appearance are COLOR_SCHEMES in $lib/theme/schemes,
            // and light and dark are what was stored before there were
            // schemes; schemes.test.ts keeps the three lists in step.
            (function () {
                var schemes = {
                    'catppuccin-latte': 'light',
                    'catppuccin-frappe': 'dark',
                    'catppuccin-macchiato': 'dark',
                    'catppuccin-mocha': 'dark',
                    'solarized-light': 'light',
                    'solarized-dark': 'dark',
                };
                var legacy = { light: 'catppuccin-latte', dark: 'catppuccin-macchiato' };
                var id = 'catppuccin-macchiato';
                try {
                    var stored = localStorage.getItem('oyot:theme');
                    if (stored && legacy.hasOwnProperty(stored)) stored = legacy[stored];
                    if (stored && schemes.hasOwnProperty(stored)) id = stored;
                } catch (e) {
                    // No storage; the default it is.
                }
                document.documentElement.dataset.scheme = id;
                document.documentElement.dataset.theme = schemes[id];
            })();
        </script>
        <script>
            // Android's status and gesture bars, measured by MainActivity
            // (window.OyotInsets only exists there). Read here, before the
            // first paint, so the page does not start under the status bar
            // and jump down once the app has loaded. Read again on resize,
            // since rotating the device moves the bars and the cutout.
            // MainActivity also pushes changes itself, through the same
            // function.
            window.__oyotApplyInsets = function (insets) {
                try {
                    if (!insets && window.OyotInsets) {
                        insets = JSON.parse(window.OyotInsets.get());
                    }
                    if (!insets) return;
                    var style = document.documentElement.style;
                    ['top', 'right', 'bottom', 'left'].forEach(function (side) {
                        style.setProperty('--native-safe-' + side, (insets[side] || 0) + 'px');
                    });
                } catch (e) {
                    // Without the numbers the page falls back to env().
                }
            };
            window.__oyotApplyInsets();
            window.addEventListener('resize', function () {
                window.__oyotApplyInsets();
            });
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
