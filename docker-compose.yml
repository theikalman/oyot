services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: oyot-mqtt
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=UTC
    restart: unless-stopped
    # Subscribes anonymously, which the development config allows. Against the
    # hardened config this needs `-u`/`-P`, or it will report the broker
    # unhealthy for ever while it works perfectly well.
    healthcheck:
      test:
        [
          'CMD',
          'timeout',
          '1',
          'mosquitto_sub',
          '-t',
          '$$SYS/#',
          '-C',
          '1',
          '-i',
          'healthcheck',
          '-W',
          '3',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
